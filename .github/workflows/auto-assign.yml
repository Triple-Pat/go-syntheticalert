name: Auto-assign
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  assign:
    name: Assign to pboothe
    runs-on: ubuntu-latest
    steps:
      # Issues only. Pull requests get a review request from
      # .github/CODEOWNERS instead, which needs no privileged trigger.
      - name: Add assignee
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh api "repos/${{ github.repository }}/issues/${NUMBER}/assignees" -f 'assignees[]=pboothe'
